working_directory: /maria_backend
build_context_directory: /maria_backend

build:
  system: auto
  command: npm ci --include=dev --no-audit --no-fund && npm run prisma:generate && npm run build
  min_memory: 512
  max_memory: 2048

start_command: node scripts/start-prod.mjs

health_check:
  type: http
  http_path: /health
  interval_in_seconds: 30
